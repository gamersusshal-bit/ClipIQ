<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipIQ · Highlight review</title><style>
*{box-sizing:border-box}p,small,h2{overflow-wrap:anywhere}@media(max-width:600px){body{padding:16px!important}section,article{padding:16px!important}}
:root{color-scheme:dark;font:16px system-ui;background:#0d1421;color:#e5edf6}body{max-width:1100px;margin:auto;padding:32px}h1{font-size:36px;margin-bottom:6px}h2{font-size:21px}p{color:#a6b6ca;line-height:1.55}section,article{background:#152033;border:1px solid #2c3b50;border-radius:12px;padding:22px;margin:20px 0}label{display:block;font-size:14px;color:#c0cfdf;margin:12px 0}input,button,select{font:inherit;border-radius:6px;padding:10px;border:1px solid #43556d;background:#0d1421;color:#fff}input[type=text]{width:100%}input[type=number]{width:90px}button{cursor:pointer;background:#164e63;margin:5px 8px 5px 0}button:hover{background:#22677f}button:disabled{opacity:.45}video{width:100%;max-height:420px;background:#000;border-radius:6px}a{color:#70dcdb}small{color:#a6b6ca}.row{display:flex;gap:20px;flex-wrap:wrap}.badge{color:#ffd696}#status{white-space:pre-wrap}.notice{border-left:3px solid #d2a859;padding-left:12px}.actions{margin-top:12px}
</style><h1>ClipIQ</h1><p>Find the moment. Check the context. Keep the highlight.</p>
<section><h2>Process a video</h2><form id="runform">
<label>Video path on this computer<input id="video" list="videos" type="text" required placeholder="/Users/…/clipiq/data/raw/test_video2.mp4"></label>
<datalist id="videos"></datalist>
<label>Existing processed cache folder (optional; must belong to this video)<input id="legacy" type="text" placeholder="/Users/…/clipiq/data/processed"></label>
<label>Timestamped transcript JSON (optional)<input id="transcript" type="text" placeholder="Leave blank to use an installed Whisper model"></label>
<div class="row"><label>Highlights<input id="count" type="number" min="1" value="5"></label><label>Maximum seconds<input id="maximum" type="number" min="2" value="60"></label><label><input id="nospeech" type="checkbox"> Skip speech analysis</label></div>
<button id="runbutton">Generate proposals</button><small>No model downloads from this screen. Analysis resumes from valid caches.</small></form><p id="status" role="status">Loading…</p></section>
<div id="summary"></div><div id="clips"></div>
<script>
const token='__TOKEN__';let runId=null;let lastManifest='';
const el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
async function post(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-ClipIQ-Token':token},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error);return v}
document.querySelector('#runform').onsubmit=async e=>{e.preventDefault();try{await post('/api/run',{video:document.querySelector('#video').value,legacy_dir:document.querySelector('#legacy').value,transcript:document.querySelector('#transcript').value,no_speech:document.querySelector('#nospeech').checked,top_k:+document.querySelector('#count').value,max_duration:+document.querySelector('#maximum').value});await poll()}catch(e){document.querySelector('#status').textContent=e.message}};
function render(m){runId=m.run_id;const summary=document.querySelector('#summary');summary.replaceChildren(el('h2',`${m.clips.length} proposals · ${m.status}`),el('p',`Saved in ${m.output_dir}`));for(const w of m.warnings||[])summary.append(el('p',w));const root=document.querySelector('#clips');root.replaceChildren();if(!m.clips.length)root.append(el('p','No highlights detected. Try a video with more distinct events.'));
for(const c of m.clips){const card=el('article');card.append(el('h2',`${c.clip_id} · relative score ${c.score.toFixed(2)}`));const label=el('p','Needs review · '+c.confidence+' boundary confidence');label.className='badge';card.append(label,el('p',`Original: ${c.source_start.toFixed(2)}–${c.source_end.toFixed(2)}s · Proposed: ${c.start.toFixed(2)}–${c.end.toFixed(2)}s`));if(c.transcript_excerpt)card.append(el('p',c.transcript_excerpt));card.append(el('small',c.reason_codes.map(r=>r.replaceAll('_',' ')).join(' · ')));const player=el('video');player.controls=true;player.preload='metadata';player.hidden=!c.export;if(c.export)player.src='/media/clip/'+encodeURIComponent(c.clip_id);card.append(player);
let stop=null;player.ontimeupdate=()=>{if(stop!==null&&player.currentTime>=stop)player.pause()};
const inputs=el('div');inputs.className='row';const start=el('input'),end=el('input');for(const [input,name,value] of [[start,'Start (seconds)',c.start],[end,'End (seconds)',c.end]]){input.type='number';input.step='.01';input.min=0;input.max=m.video_duration;input.value=value.toFixed(2);const l=el('label',name);l.append(input);inputs.append(l)}card.append(inputs);
const actions=el('div');actions.className='actions';const msg=el('p');msg.id='decision-'+c.clip_id;
const original=el('button','Play original interval');original.onclick=()=>{player.hidden=false;stop=c.source_end;player.src='/media/source#t='+c.source_start+','+c.source_end;player.onloadedmetadata=()=>{player.currentTime=c.source_start;player.play().catch(()=>{})}};actions.append(original);
for(const [action,title] of [['preview','Preview adjusted clip'],['approve','Approve & export'],['reject','Reject']]){const b=el('button',title);b.onclick=async()=>{b.disabled=true;msg.textContent='Saving…';try{const d=await post('/api/review',{run_id:runId,clip_id:c.clip_id,action,start:+start.value,end:+end.value});msg.replaceChildren(el('span',action==='reject'?'Rejected. Decision saved. ':action==='approve'?'Approved. New export saved. ':'Adjusted preview saved. '));if(d.export){const url='/media/review/'+d.decision_id;const link=el('a','Download clip');link.href=url;link.download=c.clip_id+'.mp4';msg.append(link);stop=null;player.hidden=false;player.onloadedmetadata=null;player.src=url;player.load()}}catch(e){msg.textContent=e.message}finally{b.disabled=false}};actions.append(b)}if(c.export){const a=el('a','Download proposal');a.href='/media/clip/'+c.clip_id;a.download=c.clip_id+'.mp4';actions.append(a)}card.append(actions,msg);root.append(card)}}
async function poll(){try{const r=await fetch('/api/state');const s=await r.json();document.querySelector('#runbutton').disabled=s.busy;document.querySelector('#status').textContent=s.error|| (s.busy?'Processing locally… progress is also shown in the terminal.':'Ready. Review proposals before sharing.');if(s.manifest){const key=s.manifest.run_id+':'+s.manifest.status;if(key!==lastManifest){lastManifest=key;render(s.manifest)}for(const [id,d] of Object.entries(s.decisions||{})){const n=document.getElementById('decision-'+id);if(n&&!n.querySelector('a')){n.textContent='Last saved decision: '+d.action+' · '+d.start.toFixed(2)+'–'+d.end.toFixed(2)+'s';if(d.export){const a=el('a',' Download saved clip');a.href='/media/review/'+d.decision_id;a.download=id+'.mp4';n.append(a)}}}}}catch(e){document.querySelector('#status').textContent='Cannot reach ClipIQ. Check that the review command is running.'}}
fetch('/api/videos').then(r=>r.json()).then(paths=>{for(const path of paths){const o=el('option');o.value=path;document.querySelector('#videos').append(o)}}).catch(()=>{});
poll();setInterval(poll,2500);
</script></html>
